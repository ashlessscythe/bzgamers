name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so Prisma generate / Next build can compile without secrets.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  AUTH_SECRET: ci-auth-secret
  NEXTAUTH_SECRET: ci-auth-secret
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_NAME: bzgamers-ci
  NEXT_API_CLIENT_ID: ci-client-id
  NEXT_API_CLIENT_SECRET: ci-client-secret
  RESEND_API_KEY: re_ci_dummy_key
  RESEND_FROM_EMAIL: CI <ci@example.com>
  NEXT_TURNSTILE_SECRET_KEY: ci-turnstile-secret
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-key

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build
